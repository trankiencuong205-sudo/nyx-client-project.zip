name: Build Nyx Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project from ZIP
        run: |
          test -f nyx-client-project.zip || { echo "nyx-client-project.zip is missing in the repository root"; exit 1; }
          unzip -oq nyx-client-project.zip
          cp -a nyx/. .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve compatible library versions for Minecraft 1.21.1
        run: python3 scripts/resolve_versions.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Summarize errors
        if: failure()
        run: |
          {
            echo "### Build failed - copy the text below and send it back"
            echo '```'
            grep -E "error:|What went wrong|Could not|FAILED" -A4 build.log | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: nyx-client-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
